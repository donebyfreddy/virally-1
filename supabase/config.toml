# Supabase local development configuration.
#
# `project_id` is the local container namespace, not the linked cloud project —
# `supabase link` writes the cloud ref to supabase/.temp/, which is gitignored.

project_id = "virally"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
# `app` is deliberately absent. It holds the authorization helper functions and
# the role→permission table, which must never be reachable over the REST API.
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

# Catches outbound mail locally so confirmation and recovery links can be tested
# without a real mail provider.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
# 500 MB. Source video uploads are the largest object the product accepts; the
# per-bucket limits set in the storage migration are tighter than this ceiling.
file_size_limit = "500MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
# Every redirect target must be listed explicitly. Supabase matches these
# exactly, and an unlisted URL fails the exchange rather than redirecting.
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/confirm",
  "http://127.0.0.1:3100/auth/callback",
  "http://127.0.0.1:3100/auth/confirm",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
# Matches PASSWORD_MIN_LENGTH in src/lib/auth/password.ts. Keep the two in step.
minimum_password_length = 8
password_requirements = ""

[auth.email]
enable_signup = true
double_confirm_changes = true
# Confirmation required. Turning this off would let anyone create an account on
# an address they do not control, and the product emails publishing alerts.
enable_confirmations = true
secure_password_change = true

[auth.sessions]
# Ends sessions idle for 30 days rather than never.
inactivity_timeout = "720h"

[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = "http://localhost:54321/auth/v1/callback"
skip_nonce_check = false
